name: 'npm-dependency-stats-action'
description: 'An action for getting stats about npm dependencies'
author: 'Side Inc.'
inputs:
  working-directory:
    required: false
    description: 'Current working directory'
  packages-folder:
    required: false
    default: 'packages'
    description: 'Path to the packages folder'
  output-file:
    required: false
    description: 'Path for output json file'
  is-monorepo:
    required: false
    description: 'Whether or not repo is a monorepo'
  log-results:
    required: false
    default: 'false'
    description: 'Whether or not to log dependency info to Github Actions output'
  minimum-release-age:
    required: false
    default: ''
    description:
      'Minimum age of a release before it is considered actionable (e.g. "14
      days"). Outdated dependencies where every version newer than the
      installed version is younger than this are reported as quarantined and
      counted as up to date, matching the behavior of the minimumReleaseAge
      setting in Renovate. Empty (default) disables quarantine filtering.'
runs:
  using: 'node24'
  main: 'dist/index.mjs'
